    <link rel="stylesheet" href="../../vendor/bootstrap/bootstrap.css" />

      <div class="container-fluid">
        <div class="header__wrapper">

            <a class="header__logo-link" href="#">
              <img
                class="header__logo-img"
                src="../../images/header/logo.svg"
                alt="logo"
              />
            </a>
            <button class="header__country">
              <i class="header__country-icon bi bi-geo-alt"></i>
              <span class="header__country-title"></span>
            </button>
          </div>
          <div class="header__left">
            <a class="header__left-link" href="#">
              <i class="header__left-icon bi bi-person"></i>
              دیوار من
            </a>
            <div class="header__left-dropdown">
              <ul class="header__left-dropdown-list">
                <li class="header__left-dropdown-item">
                  <a class="header__left-dropdown-link" href="#">
                    <i
                      class="header__left-dropdown-icon bi bi-box-arrow-in-left"
                    ></i>
                    ورود
                  </a>
                </li>
                <li class="header__left-dropdown-item">
                  <a class="header__left-dropdown-link" href="#">
                    <i class="header__left-dropdown-icon bi bi-journal"></i>
                    یادداشت ها
                  </a>
                </li>
                <li class="header__left-dropdown-item">
                  <a class="header__left-dropdown-link" href="#">
                    <i
                      class="header__left-dropdown-icon bi bi-clock-history"
                    ></i>
                    بازدید های اخیر
                  </a>
                </li>
                <li class="header__left-dropdown-item">
                  <a class="header__left-dropdown-link" href="#">
                    <i class="header__left-dropdown-icon bi bi-shop"></i>
                    دیوار برای کسب و کارها
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!--!==========================================End Header==========================================!-->

    <!--!==========================================Main==========================================!-->
    <main class="main">
      <div class="container-fluid">
        <div class="row">
          <div class="col-3">
            <div class="sidebar">
              <div class="sidebar__user">
                <div class="sidebar__user-right">
                  <i class="sidebar__user-icon bi bi-person"></i>
                </div>
                <div class="sidebar__user-left">
                  <div class="sidebar__user-text">کاربر دیوار</div>
                  <p id="sidebar-phone-number" class="sidebar__user-phone"></p>
                </div>
              </div>
              <ul class="sidebar__menu-list">
                <li class="sidebar__menu-item">
                  <a class="sidebar__menu-link" href="verify.html">
                    <i class="sidebar__menu-icon bi bi-patch-check"></i>
                    تایید هویت
                  </a>
                </li>
                <li class="sidebar__menu-item">
                  <a class="sidebar__menu-link" href="posts.html">
                    <i class="sidebar__menu-icon bi bi-journal"></i>
                    آگهی های من
                  </a>
                </li>
                <li class="sidebar__menu-item">
                  <a class="sidebar__menu-link" href="notes.html">
                    <i class="sidebar__menu-icon bi bi-journal"></i>
                    یادداشت ها
                  </a>
                </li>
                <li class="sidebar__menu-item">
                  <a
                    class="sidebar__menu-link sidebar__menu-link--active"
                    href="recent-seen.html"
                  >
                    <i class="sidebar__menu-icon bi bi-clock-history"></i>
                    بازدید های اخیر
                  </a>
                </li>
              </ul>
              <p class="sidebar__logout sidebar__link-item" id="logout-btn">
                <i
                  class="sidebar__logout-icon sidebar__link-icon bi bi-box-arrow-right"
                ></i>
                خروج
              </p>
              <div class="sidebar__links">
                <a class="sidebar__link" href="#">درباره دیوار</a>
                <a class="sidebar__link" href="#">دریافت برنامه</a>
                <a class="sidebar__link" href="#">پشتیبانی و قوانین</a>
              </div>
              <div class="sidebar__social">
                <a class="sidebar__social-link" href="#">
                  <i class="sidebar__social-icon bi bi-twitter"></i>
                </a>
                <a class="sidebar__social-link" href="#">
                  <i class="sidebar__social-icon bi bi-instagram"></i>
                </a>
                <a class="sidebar__social-link" href="#">
                  <i class="sidebar__social-icon bi bi-linkedin"></i>
                </a>
              </div>
            </div>
          </div>
          <div class="col-9">
            <section class="posts" id="posts-container"></section>

        </div>
      </div>
    </main>
    <!--!==========================================End Main==========================================!-->

    <!--!==========================================city Modal==========================================!-->
    <section class="country-modal">
      <div class="country-modal__header">
        <div class="country-modal__header-wrapper">
          <div class="country-modal__title-wrapper">
            <span class="country-modal__title">انتخاب شهر</span>
            <button class="country-modal__btn">حذف همه</button>
          </div>
          <div class="country-modal__selected"></div>
          <div class="country-modal__searchbar">
            <form class="country-modal__form">
              <input
                class="country-modal__input"
                type="text"
                placeholder="جستجو در شهرها"
              />
              <i class="country-modal__icon bi bi-search"></i>
            </form>
          </div>
        </div>
      </div>
      <div class="country-modal__cities">
        <ul class="country-modal__cities-list"></ul>
      </div>
      <div class="country-modal__footer">
        <div class="country-modal__footer-wrapper">
          <button class="country-modal__btn-footer country-modal__close">
            انصراف
          </button>
          <button
            class="country-modal__btn-footer country-modal__accept--active"
          >
            تایید
          </button>
        </div>
      </div>
    </section>
    <!--!==========================================Overlay Modal==========================================!-->
    <section class="overlay"></section>
    <!--!==========================================End Overlay Modal==========================================!-->

    <script src="../../js/usable.js" type="module"></script>
    <script src="../../js/userPanel/usable.js" type="module"></script>
  </body>
</html>
